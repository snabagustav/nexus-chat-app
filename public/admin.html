<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nexus Admin</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0e1018;color:#eef0f7}button,input{font:inherit}
    .shell{min-height:100vh;display:grid;grid-template-columns:260px 1fr}.side{background:#171923;border-right:1px solid #ffffff12;padding:18px;display:flex;flex-direction:column;gap:18px}.brand{display:flex;align-items:center;gap:12px}.mark{width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,#5865f2,#eb459e);display:grid;place-items:center;font-weight:900}.brand h1{font-size:18px;margin:0}.brand p{margin:2px 0 0;color:#9aa1b3;font-size:12px}.nav{display:grid;gap:8px}.nav button,.back{border:0;border-radius:11px;background:transparent;color:#b9bfd0;text-align:left;padding:12px;cursor:pointer}.nav button.active,.nav button:hover,.back:hover{background:#242735;color:#fff}.back{margin-top:auto;border:1px solid #ffffff12}
    .top{height:70px;border-bottom:1px solid #ffffff12;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#12141d}.top h2{margin:0}.top small{color:#9aa1b3}.content{padding:24px;display:grid;gap:20px}.page{display:none}.page.active{display:grid;gap:20px}
    .stats{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:14px}.stat,.card{background:#171923;border:1px solid #ffffff12;border-radius:18px;box-shadow:0 16px 44px #0005}.stat{padding:16px}.stat b{font-size:28px}.stat span{display:block;margin-top:5px;color:#9aa1b3;text-transform:uppercase;font-size:11px;font-weight:900}.card{overflow:hidden}.head{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid #ffffff12}.head h3{margin:0}.head input{background:#0e1018;border:1px solid #ffffff1a;border-radius:10px;color:white;padding:10px;min-width:240px}
    table{width:100%;border-collapse:collapse}th{text-align:left;color:#8991a6;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:11px 14px;background:#11131c}td{padding:13px 14px;border-top:1px solid #ffffff0d;vertical-align:middle}tr:hover td{background:#ffffff08}.user{display:flex;gap:10px;align-items:center}.avatar{width:36px;height:36px;border-radius:50%;background:#5865f2;display:grid;place-items:center;font-weight:900}.muted{color:#9aa1b3}.badge{display:inline-flex;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:900;background:#242735;color:#cbd1e1}.badge.admin{background:#5865f233;color:#b9c0ff}.badge.moderator{background:#23a55926;color:#8df0b5}.badge.warn{background:#f0b23226;color:#ffe09a}.badge.bad{background:#ed424526;color:#ffb4b4}
    .actions{display:flex;flex-wrap:wrap;gap:6px}.btn{border:0;border-radius:8px;background:#2b2f3d;color:#fff;padding:8px 10px;cursor:pointer;font-weight:900;font-size:12px}.btn:hover{filter:brightness(1.12)}.good{background:#23a559}.bad{background:#ed4245}.warn{background:#b7791f}.primary{background:#5865f2}.toast{position:fixed;right:18px;bottom:18px;background:#171923;border:1px solid #ffffff22;border-radius:13px;padding:13px 16px;box-shadow:0 18px 50px #0009;opacity:0;transform:translateY(20px);transition:.2s}.toast.show{opacity:1;transform:none}.empty{padding:24px;text-align:center;color:#9aa1b3}
    @media(max-width:950px){.shell{display:block}.stats{grid-template-columns:repeat(2,1fr)}.content{padding:12px}.head{flex-direction:column;align-items:stretch}.head input{min-width:0}.table{overflow-x:auto}.actions{min-width:520px}td,th{white-space:nowrap}}
  </style>
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand"><div class="mark">N</div><div><h1>Nexus Admin</h1><p>Everything panel</p></div></div>
      <nav class="nav">
        <button class="active" data-page="dashboard">Dashboard</button>
        <button data-page="users">Users</button>
        <button data-page="rooms">Rooms</button>
      </nav>
      <button class="back" onclick="location.href='/'">Back to app</button>
    </aside>
    <main>
      <header class="top"><div><h2 id="title">Dashboard</h2><small id="updated">Loading...</small></div><button class="btn primary" onclick="load()">Refresh</button></header>
      <div class="content">
        <section id="dashboard" class="page active">
          <div class="stats" id="stats"></div>
          <div class="card"><div class="head"><h3>Quick control</h3></div><div style="padding:18px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" onclick="show('users')">Manage users</button><button class="btn primary" onclick="show('rooms')">Manage rooms</button><button class="btn" onclick="location.href='/'">Open app</button></div></div>
        </section>
        <section id="users" class="page">
          <div class="card"><div class="head"><h3>Users</h3><input id="user-q" placeholder="Search users..." oninput="renderUsers()"></div><div class="table"><table><thead><tr><th>User</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead><tbody id="users-body"></tbody></table></div></div>
        </section>
        <section id="rooms" class="page">
          <div class="card"><div class="head"><h3>Rooms</h3><input id="room-q" placeholder="Search rooms..." oninput="renderRooms()"></div><div class="table"><table><thead><tr><th>Room</th><th>Type</th><th>Live</th><th>Messages</th><th>Actions</th></tr></thead><tbody id="rooms-body"></tbody></table></div></div>
        </section>
      </div>
    </main>
  </div>
  <div id="toast" class="toast"></div>
  <script>
    const h={Authorization:'Bearer '+localStorage.nexus_token,'Content-Type':'application/json'};let S={stats:{},users:[],rooms:[]};
    document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.page));
    function show(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===id));document.getElementById(id).classList.add('active');title.textContent=id[0].toUpperCase()+id.slice(1)}
    async function get(p){const r=await fetch(p,{headers:h});if(!r.ok)throw new Error(await r.text());return r.json()}
    async function act(p,b,m){const r=await fetch(p,{method:'POST',headers:h,body:JSON.stringify(b)});let ok=r.ok;toast(ok?m:'Failed: '+(await r.text()).slice(0,80));if(ok)await load()}
    function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2300)}
    async function load(){try{S.stats=await get('/api/admin/stats');S.users=await get('/api/admin/users');S.rooms=await get('/api/admin/rooms');renderStats();renderUsers();renderRooms();updated.textContent='Updated '+new Date().toLocaleTimeString()}catch(e){document.body.innerHTML=`<main style="padding:30px"><h1>No admin access</h1><p>Go back, press A and enter PIN 5693 first.</p><button onclick="location.href='/'">Back</button></main>`}}
    function renderStats(){stats.innerHTML=[['Users',S.stats.totalUsers],['Online',S.stats.onlineUsers],['Rooms',S.stats.totalRooms],['Messages',S.stats.totalMessages],['Games',S.stats.games||0],['Muted',S.stats.muted||0]].map(x=>`<div class=stat><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}
    function renderUsers(){const q=(userQ()?.value||'').toLowerCase();const rows=S.users.filter(u=>(u.username+' '+(u.email||'')+' '+u.role).toLowerCase().includes(q));document.getElementById('users-body').innerHTML=rows.length?rows.map(u=>`<tr><td><div class=user><div class=avatar>${(u.avatar||'?').toUpperCase()}</div><b>${u.username}</b></div></td><td class=muted>${u.email||'Anonymous'}</td><td><span class="badge ${u.role}">${u.role}</span></td><td>${u.muted?'<span class="badge warn">muted</span>':''} ${u.banned?'<span class="badge bad">banned</span>':''}</td><td><div class=actions><button class="btn warn" onclick="act('/api/admin/mute',{userId:'${u.id}'},'Muted')">Mute</button><button class=btn onclick="act('/api/admin/unmute',{userId:'${u.id}'},'Unmuted')">Unmute</button><button class="btn bad" onclick="act('/api/admin/kick',{userId:'${u.id}'},'Kicked')">Kick</button><button class="btn bad" onclick="act('/api/admin/ban',{userId:'${u.id}'},'Banned')">Ban</button><button class=btn onclick="act('/api/admin/unban',{userId:'${u.id}'},'Unbanned')">Unban</button><button class="btn good" onclick="act('/api/admin/add-mod',{userId:'${u.id}'},'Moderator added')">Make mod</button><button class=btn onclick="act('/api/admin/remove-mod',{userId:'${u.id}'},'Moderator removed')">Remove mod</button></div></td></tr>`).join(''):'<tr><td colspan=5><div class=empty>No users found</div></td></tr>'}
    function renderRooms(){const q=(roomQ()?.value||'').toLowerCase();const rows=S.rooms.filter(r=>r.name.toLowerCase().includes(q));document.getElementById('rooms-body').innerHTML=rows.length?rows.map(r=>{const safeName=String(r.name).replace(/'/g,"\\'");const del=r.id==='general'?'':`<button class="btn bad" onclick="act('/api/admin/delete-room',{roomId:'${r.id}'},'Room deleted')">Delete</button>`;return `<tr><td><b># ${r.name}</b><br><span class=muted>${r.id}</span></td><td>${r.private?'<span class="badge warn">private</span>':'<span class=badge>public</span>'}</td><td>${r.memberCount}</td><td>${r.messageCount}</td><td><div class=actions><button class="btn warn" onclick="act('/api/admin/clear-room',{roomId:'${r.id}'},'Messages cleared')">Clear</button><button class=btn onclick="renameRoom('${r.id}','${safeName}')">Rename</button>${del}</div></td></tr>`}).join(''):'<tr><td colspan=5><div class=empty>No rooms found</div></td></tr>'}
    function renameRoom(id,old){const name=prompt('New room name',old);if(name)act('/api/admin/rename-room',{roomId:id,name},'Room renamed')}
    function userQ(){return document.getElementById('user-q')}function roomQ(){return document.getElementById('room-q')}load();
  </script>
</body>
</html>
