<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus Admin</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0f1017;color:#eef0f7}button,input{font:inherit}.shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:#171923;border-right:1px solid #ffffff12;padding:18px;display:flex;flex-direction:column;gap:18px}.mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#5865f2,#eb459e);display:grid;place-items:center;font-weight:900}.brand{display:flex;gap:12px;align-items:center}.brand h1{font-size:18px;margin:0}.brand p{margin:2px 0 0;color:#9aa1b3;font-size:12px}.nav{display:grid;gap:8px}.nav button,.back{border:0;border-radius:10px;background:transparent;color:#b9bfd0;text-align:left;padding:11px 12px;cursor:pointer}.nav button.active,.nav button:hover,.back:hover{background:#242735;color:#fff}.back{margin-top:auto;border:1px solid #ffffff12}.top{height:68px;border-bottom:1px solid #ffffff12;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#12141d}.content{padding:24px;display:grid;gap:20px}.page{display:none}.page.active{display:grid;gap:20px}.stats{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:14px}.stat,.card{background:#171923;border:1px solid #ffffff12;border-radius:16px;padding:16px;box-shadow:0 12px 34px #0004}.stat b{font-size:28px}.stat span{display:block;color:#9aa1b3;text-transform:uppercase;font-size:12px}.head{display:flex;justify-content:space-between;margin:-16px -16px 12px;padding:16px;border-bottom:1px solid #ffffff12}.head input{background:#0f1017;border:1px solid #ffffff18;border-radius:10px;color:#fff;padding:10px}table{width:100%;border-collapse:collapse}th{text-align:left;color:#8991a6;font-size:11px;text-transform:uppercase;padding:10px}td{padding:12px 10px;border-top:1px solid #ffffff0d}.badge{border-radius:999px;padding:4px 9px;background:#242735;font-weight:800}.admin{color:#b9c0ff}.moderator{color:#8df0b5}.actions{display:flex;gap:6px;flex-wrap:wrap}.btn{border:0;border-radius:8px;background:#2b2f3d;color:#fff;padding:7px 9px;cursor:pointer;font-weight:800}.good{background:#23a559}.bad{background:#ed4245}.warn{background:#b7791f}@media(max-width:900px){.shell{display:block}.stats{grid-template-columns:repeat(2,1fr)}.content{padding:12px;overflow:auto}}</style></head><body><div class="shell"><aside class="side"><div class="brand"><div class="mark">N</div><div><h1>Nexus Admin</h1><p>Control center</p></div></div><nav class="nav"><button class="active" data-page="dashboard">Dashboard</button><button data-page="users">Users</button><button data-page="rooms">Rooms</button></nav><button class="back" onclick="location.href='/'">Back to app</button></aside><main><header class="top"><h2 id="title">Dashboard</h2><button class="btn" onclick="load()">Refresh</button></header><div class="content"><section id="dashboard" class="page active"><div id="stats" class="stats"></div></section><section id="users" class="page"><div class="card"><div class="head"><b>Users</b><input id="user-q" placeholder="Search" oninput="renderUsers()"></div><table><tbody id="users-body"></tbody></table></div></section><section id="rooms" class="page"><div class="card"><div class="head"><b>Rooms</b><input id="room-q" placeholder="Search" oninput="renderRooms()"></div><table><tbody id="rooms-body"></tbody></table></div></section></div></main></div><script>const h={Authorization:'Bearer '+localStorage.nexus_token,'Content-Type':'application/json'};let S={};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.page));function show(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===id));document.getElementById(id).classList.add('active');title.textContent=id[0].toUpperCase()+id.slice(1)}async function get(p){let r=await fetch(p,{headers:h});if(!r.ok)throw Error();return r.json()}async function act(p,b){await fetch(p,{method:'POST',headers:h,body:JSON.stringify(b)});load()}async function load(){try{S.stats=await get('/api/admin/stats');S.users=await get('/api/admin/users');S.rooms=await get('/api/admin/rooms');renderStats();renderUsers();renderRooms()}catch{document.body.innerHTML='<main style="padding:30px"><h1>No admin access</h1><p>Go back, press A and enter PIN 5693.</p><button onclick="location.href=\\'/\\'">Back</button></main>'}}function renderStats(){stats.innerHTML=[['Users',S.stats.totalUsers],['Online',S.stats.onlineUsers],['Rooms',S.stats.totalRooms],['Messages',S.stats.totalMessages],['Games',S.stats.games||0]].map(x=>`<div class=stat><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}function renderUsers(){let q=(document.getElementById('user-q')?.value||'').toLowerCase();usersBody=document.getElementById('users-body');usersBody.innerHTML=S.users.filter(u=>(u.username+' '+u.role).toLowerCase().includes(q)).map(u=>`<tr><td><b>${u.username}</b><br><small>${u.email||'Anonymous'}</small></td><td><span class="badge ${u.role}">${u.role}</span></td><td><div class=actions><button class="btn warn" onclick="act('/api/admin/mute',{userId:'${u.id}'})">Mute</button><button class=btn onclick="act('/api/admin/unmute',{userId:'${u.id}'})">Unmute</button><button class="btn bad" onclick="act('/api/admin/kick',{userId:'${u.id}'})">Kick</button><button class="btn bad" onclick="act('/api/admin/ban',{userId:'${u.id}'})">Ban</button><button class="btn good" onclick="act('/api/admin/add-mod',{userId:'${u.id}'})">Mod</button><button class=btn onclick="act('/api/admin/remove-mod',{userId:'${u.id}'})">Unmod</button></div></td></tr>`).join('')}function renderRooms(){let q=(document.getElementById('room-q')?.value||'').toLowerCase();roomsBody=document.getElementById('rooms-body');roomsBody.innerHTML=S.rooms.filter(r=>r.name.toLowerCase().includes(q)).map(r=>`<tr><td><b># ${r.name}</b><br><small>${r.id}</small></td><td>${r.private?'private':'public'}</td><td>${r.memberCount} members / ${r.messageCount} messages</td><td><button class="btn warn" onclick="act('/api/admin/clear-room',{roomId:'${r.id}'})">Clear</button></td></tr>`).join('')}load()</script></body></html>
