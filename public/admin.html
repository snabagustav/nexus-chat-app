<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus Admin</title><style>body{margin:0;font-family:Arial;background:#0e1018;color:#eef0f7}.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.side{background:#171923;padding:18px}.side button{display:block;width:100%;margin:8px 0;text-align:left}.top{padding:20px;background:#12141d}.content{padding:20px}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.stat,.card{background:#171923;border:1px solid #ffffff18;border-radius:16px;padding:16px;margin-bottom:16px}.stat b{font-size:28px}button{border:0;border-radius:8px;background:#5865f2;color:white;padding:8px;margin:2px;font-weight:bold}input{background:#0e1018;color:white;border:1px solid #ffffff22;border-radius:8px;padding:8px}table{width:100%;border-collapse:collapse}td,th{border-top:1px solid #ffffff12;padding:10px;text-align:left}.bad{background:#ed4245}.warn{background:#b7791f}.good{background:#23a559}.page{display:none}.page.active{display:block}@media(max-width:900px){.shell{display:block}.stats{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="shell"><aside class="side"><h2>Nexus Admin</h2><button onclick="show('dash')">Dashboard</button><button onclick="show('users')">Users</button><button onclick="show('rooms')">Rooms</button><button onclick="location.href='/'">Back</button></aside><main><div class="top"><h1 id="title">Dashboard</h1><button onclick="load()">Refresh</button></div><div class="content"><section id="dash" class="page active"><div id="stats" class="stats"></div></section><section id="users" class="page"><div class="card"><h2>Users</h2><input id="uq" placeholder="Search" oninput="renderUsers()"><table><tbody id="ub"></tbody></table></div></section><section id="rooms" class="page"><div class="card"><h2>Rooms</h2><input id="rq" placeholder="Search" oninput="renderRooms()"><table><tbody id="rb"></tbody></table></div></section></div></main></div><script>const h={Authorization:'Bearer '+localStorage.nexus_token,'Content-Type':'application/json'};let S={users:[],rooms:[],stats:{}};function show(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');title.textContent=id==='dash'?'Dashboard':id}async function get(p){let r=await fetch(p,{headers:h});if(!r.ok)throw Error();return r.json()}async function act(p,b){await fetch(p,{method:'POST',headers:h,body:JSON.stringify(b)});load()}async function load(){try{S.stats=await get('/api/admin/stats');S.users=await get('/api/admin/users');S.rooms=await get('/api/admin/rooms');renderStats();renderUsers();renderRooms()}catch{document.body.innerHTML='<h1>No admin access</h1><p>Go back, press A, PIN 5693.</p><button onclick=\"location.href=\\'/\\'\">Back</button>'}}function renderStats(){stats.innerHTML=[['Users',S.stats.totalUsers],['Online',S.stats.onlineUsers],['Rooms',S.stats.totalRooms],['Messages',S.stats.totalMessages],['Games',S.stats.games],['Muted',S.stats.muted]].map(x=>'<div class=stat><b>'+x[1]+'</b><br>'+x[0]+'</div>').join('')}function renderUsers(){let q=(uq.value||'').toLowerCase();ub.innerHTML=S.users.filter(u=>(u.username+u.role).toLowerCase().includes(q)).map(u=>`<tr><td><b>${u.username}</b><br>${u.email||'anon'}</td><td>${u.role}</td><td><button class=warn onclick="act('/api/admin/mute',{userId:'${u.id}'})">Mute</button><button onclick="act('/api/admin/unmute',{userId:'${u.id}'})">Unmute</button><button class=bad onclick="act('/api/admin/kick',{userId:'${u.id}'})">Kick</button><button class=bad onclick="act('/api/admin/ban',{userId:'${u.id}'})">Ban</button><button onclick="act('/api/admin/unban',{userId:'${u.id}'})">Unban</button><button class=good onclick="act('/api/admin/add-mod',{userId:'${u.id}'})">Mod</button><button onclick="act('/api/admin/remove-mod',{userId:'${u.id}'})">Unmod</button></td></tr>`).join('')}function renderRooms(){let q=(rq.value||'').toLowerCase();rb.innerHTML=S.rooms.filter(r=>r.name.toLowerCase().includes(q)).map(r=>`<tr><td><b># ${r.name}</b><br>${r.id}</td><td>${r.memberCount} online / ${r.messageCount} messages</td><td><button class=warn onclick="act('/api/admin/clear-room',{roomId:'${r.id}'})">Clear</button><button onclick="ren('${r.id}','${r.name}')">Rename</button>${r.id==='general'?'':`<button class=bad onclick="act('/api/admin/delete-room',{roomId:'${r.id}'})">Delete</button>`}</td></tr>`).join('')}function ren(id,n){let v=prompt('New name',n);if(v)act('/api/admin/rename-room',{roomId:id,name:v})}load()</script></body></html>
