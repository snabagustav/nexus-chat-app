<!doctype html><html><head><meta charset="utf-8"><title>Admin</title><style>body{font-family:Arial;background:#111;color:#eee}main{padding:20px}button{margin:3px;padding:7px;border:0;border-radius:6px;background:#5865f2;color:white}.danger{background:#ed4245}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #333;padding:8px}</style></head><body><main><h1>Nexus Admin</h1><button onclick="location.href='/'">Back</button><h2>Stats</h2><p id="stats"></p><h2>Users</h2><table><tbody id="users"></tbody></table></main><script>const h={Authorization:'Bearer '+localStorage.nexus_token,'Content-Type':'application/json'};async function g(p){let r=await fetch(p,{headers:h});if(!r.ok)throw Error();return r.json()}async function p(a,b){await fetch(a,{method:'POST',headers:h,body:JSON.stringify(b)});load()}async function load(){try{let s=await g('/api/admin/stats');stats.textContent=JSON.stringify(s);let u=await g('/api/admin/users');users.innerHTML=u.map(x=>`<tr><td>${x.username}</td><td>${x.role}</td><td><button onclick="p('/api/admin/mute',{userId:'${x.id}'})">Mute</button><button onclick="p('/api/admin/unmute',{userId:'${x.id}'})">Unmute</button><button class=danger onclick="p('/api/admin/kick',{userId:'${x.id}'})">Kick</button><button onclick="p('/api/admin/add-mod',{userId:'${x.id}'})">Mod</button></td></tr>`).join('')}catch{document.body.innerHTML='No admin access. Go back, press A and enter PIN.'}}load()</script></body></html>
