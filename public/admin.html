<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexus Admin</title>
  <style>
    body{margin:0;font-family:Arial,sans-serif;background:#111118;color:#eee}
    header{padding:16px 20px;background:#1e1f22;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center}
    main{padding:20px;display:grid;gap:18px}
    .card{background:#1e1f22;border:1px solid #333;border-radius:12px;padding:16px;overflow:auto}
    table{width:100%;border-collapse:collapse}
    th,td{padding:10px;border-bottom:1px solid #333;text-align:left}
    button{border:0;border-radius:7px;padding:7px 10px;margin:2px;background:#7c6af7;color:white;cursor:pointer}
    button.danger{background:#f23f43}
    button.warn{background:#b7791f}
    button.ghost{background:#383a40}
    .muted{color:#999}
  </style>
</head>
<body>
  <header>
    <strong>Nexus Admin</strong>
    <button onclick="location.href='/'" class="ghost">Back</button>
  </header>
  <main>
    <section class="card">
      <h2>Stats</h2>
      <div id="stats" class="muted">Loading...</div>
    </section>
    <section class="card">
      <h2>Users</h2>
      <table>
        <thead><tr><th>User</th><th>Email</th><th>Role</th><th>Actions</th></tr></thead>
        <tbody id="users"></tbody>
      </table>
    </section>
    <section class="card">
      <h2>Rooms</h2>
      <table>
        <thead><tr><th>Room</th><th>Type</th><th>Messages</th><th>Actions</th></tr></thead>
        <tbody id="rooms"></tbody>
      </table>
    </section>
  </main>
  <script>
    const token = localStorage.getItem('nexus_token');
    const headers = { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' };
    async function get(path){ const r = await fetch(path,{headers}); if(!r.ok) throw new Error(await r.text()); return r.json(); }
    async function post(path, body){ const r = await fetch(path,{method:'POST',headers,body:JSON.stringify(body)}); if(!r.ok) alert(await r.text()); await load(); }
    async function load(){
      try{
        const stats = await get('/api/admin/stats');
        document.getElementById('stats').textContent = `Users: ${stats.totalUsers} | Online: ${stats.onlineUsers} | Rooms: ${stats.totalRooms} | Messages: ${stats.totalMessages}`;
        const users = await get('/api/admin/users');
        document.getElementById('users').innerHTML = users.map(u => `
          <tr>
            <td>${u.username}</td><td>${u.email || '-'}</td><td>${u.role}${u.muted ? ' muted' : ''}${u.banned ? ' banned' : ''}</td>
            <td>
              <button class="warn" onclick="post('/api/admin/mute',{userId:'${u.id}'})">Mute</button>
              <button class="ghost" onclick="post('/api/admin/unmute',{userId:'${u.id}'})">Unmute</button>
              <button class="danger" onclick="post('/api/admin/kick',{userId:'${u.id}'})">Kick</button>
              <button class="danger" onclick="post('/api/admin/ban',{userId:'${u.id}'})">Ban</button>
              <button onclick="post('/api/admin/add-mod',{userId:'${u.id}'})">Make mod</button>
              <button class="ghost" onclick="post('/api/admin/remove-mod',{userId:'${u.id}'})">Remove mod</button>
            </td>
          </tr>`).join('');
        const rooms = await get('/api/admin/rooms');
        document.getElementById('rooms').innerHTML = rooms.map(r => `
          <tr>
            <td>${r.name}</td><td>${r.private ? 'Private' : 'Public'}</td><td>${r.messageCount}</td>
            <td>
              <button class="warn" onclick="post('/api/admin/clear-room',{roomId:'${r.id}'})">Clear</button>
              ${r.id === 'general' ? '' : `<button class="danger" onclick="post('/api/admin/delete-room',{roomId:'${r.id}'})">Delete room</button>`}
            </td>
          </tr>`).join('');
      } catch(e) {
        document.body.innerHTML = '<main><h1>No admin access</h1><p>Go back, click A, and enter the PIN first.</p><button onclick="location.href=\\'\\/\\'">Back</button></main>';
      }
    }
    load();
  </script>
</body>
</html>
