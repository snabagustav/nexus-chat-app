<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexus Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body{overflow:auto;background:var(--bg);padding:24px}
    .admin-shell{max-width:1220px;margin:0 auto}
    .admin-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
    .admin-top h1{margin:0;font-size:30px}
    .admin-actions{display:flex;gap:8px;flex-wrap:wrap}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:18px}
    .stat,.admin-panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 55px #0003}
    .stat{padding:16px}
    .stat b{font-size:28px}
    .stat span{display:block;color:var(--muted);font-weight:800;margin-top:4px}
    .admin-panel{padding:16px;margin-bottom:18px;overflow:hidden}
    .panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
    .panel-head h2{margin:0}
    table{width:100%;border-collapse:collapse}
    th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);vertical-align:middle}
    th{color:var(--muted);font-size:12px;text-transform:uppercase}
    tr:hover td{background:#ffffff08}
    .pill{display:inline-flex;border-radius:999px;padding:4px 8px;background:#ffffff12;color:var(--text);font-weight:800;font-size:12px}
    .pill.admin{background:color-mix(in srgb,var(--accent) 35%,transparent)}
    .pill.moderator{background:color-mix(in srgb,var(--good) 28%,transparent)}
    .pill.warn{background:#ed424533;color:#ffb4b4}
    .row-actions{display:flex;gap:6px;flex-wrap:wrap}
    .mini{border-radius:7px;background:#2b2d31;color:white;font-weight:800;padding:7px 9px}
    .mini.danger{background:var(--danger)}
    .mini.good{background:var(--good)}
    .notice{background:#111214;border:1px solid var(--line);border-radius:16px;padding:18px}
    @media(max-width:760px){body{padding:10px}.admin-top{align-items:flex-start;flex-direction:column}.admin-panel{overflow:auto}table{min-width:760px}}
  </style>
</head>
<body data-theme="midnight">
  <main class="admin-shell">
    <header class="admin-top">
      <div>
        <h1>Nexus Admin</h1>
        <p class="hint">Control users, rooms, moderators and messages.</p>
      </div>
      <div class="admin-actions">
        <button id="btn-refresh" class="btn primary">Refresh</button>
        <a class="btn ghost" href="/">Back to app</a>
      </div>
    </header>

    <section id="locked" class="notice hidden">
      <h2>Admin is locked</h2>
      <p class="hint">Go back to the app, click A, enter your admin PIN, then open this page again.</p>
      <a class="btn primary" href="/">Open app</a>
    </section>

    <section id="admin-content" class="hidden">
      <div id="stats" class="stats"></div>

      <section class="admin-panel">
        <div class="panel-head">
          <h2>Users</h2>
          <input id="user-filter" placeholder="Search users">
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>User</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="users-body"></tbody>
          </table>
        </div>
      </section>

      <section class="admin-panel">
        <div class="panel-head">
          <h2>Rooms</h2>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Room</th><th>ID</th><th>Type</th><th>Members</th><th>Messages</th><th>Actions</th></tr></thead>
            <tbody id="rooms-body"></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>

  <script>
    const token = localStorage.getItem('nexus_token') || '';
    const user = JSON.parse(localStorage.getItem('nexus_user') || 'null');
    const theme = localStorage.getItem('nexus_theme') || (user && user.theme) || 'midnight';
    document.body.dataset.theme = theme;

    let allUsers = [];

    async function request(path, options = {}) {
      const headers = { ...(options.headers || {}) };
      if (options.body && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
      if (token) headers.Authorization = `Bearer ${token}`;
      const res = await fetch(path, { ...options, headers });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    function pill(text, type) {
      return `<span class="pill ${type || ''}">${text}</span>`;
    }

    function showLocked(message) {
      document.getElementById('admin-content').classList.add('hidden');
      const locked = document.getElementById('locked');
      locked.classList.remove('hidden');
      if (message) locked.querySelector('.hint').textContent = message;
    }

    async function post(path, body) {
      await request(path, { method: 'POST', body: JSON.stringify(body) });
      await loadAdmin();
    }

    function renderStats(stats) {
      const labels = [
        ['totalUsers', 'Users'],
        ['onlineUsers', 'Online'],
        ['totalRooms', 'Rooms'],
        ['totalMessages', 'Messages'],
        ['games', 'Games'],
        ['muted', 'Muted'],
        ['mods', 'Moderators'],
      ];
      document.getElementById('stats').innerHTML = labels.map(([key, label]) => `
        <article class="stat"><b>${stats[key] || 0}</b><span>${label}</span></article>
      `).join('');
    }

    function renderUsers() {
      const q = document.getElementById('user-filter').value.trim().toLowerCase();
      const users = allUsers.filter(item => `${item.username} ${item.email || ''}`.toLowerCase().includes(q));
      document.getElementById('users-body').innerHTML = users.map(item => {
        const role = item.role === 'admin' ? pill('admin', 'admin') : item.role === 'moderator' ? pill('moderator', 'moderator') : pill('user');
        const status = `${item.muted ? pill('muted', 'warn') : pill('ok')} ${item.banned ? pill('banned', 'warn') : ''}`;
        return `
          <tr>
            <td><b>${escapeHtml(item.username)}</b></td>
            <td>${escapeHtml(item.email || 'anonymous')}</td>
            <td>${role}</td>
            <td>${status}</td>
            <td>
              <div class="row-actions">
                <button class="mini" data-action="mute" data-user="${item.id}">Mute</button>
                <button class="mini" data-action="unmute" data-user="${item.id}">Unmute</button>
                <button class="mini danger" data-action="kick" data-user="${item.id}">Kick</button>
                <button class="mini danger" data-action="ban" data-user="${item.id}">Ban</button>
                <button class="mini" data-action="unban" data-user="${item.id}">Unban</button>
                <button class="mini good" data-action="add-mod" data-user="${item.id}">Make mod</button>
                <button class="mini" data-action="remove-mod" data-user="${item.id}">Remove mod</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function renderRooms(rooms) {
      document.getElementById('rooms-body').innerHTML = rooms.map(room => `
        <tr>
          <td><b>${escapeHtml(room.name)}</b></td>
          <td>${escapeHtml(room.id)}</td>
          <td>${room.private ? pill('private') : pill('public')}</td>
          <td>${room.memberCount}</td>
          <td>${room.messageCount}</td>
          <td>
            <div class="row-actions">
              <button class="mini danger" data-room-action="clear-room" data-room="${room.id}">Clear chat</button>
              <button class="mini" data-room-action="rename-room" data-room="${room.id}" data-name="${escapeHtml(room.name)}">Rename</button>
              <button class="mini danger" data-room-action="delete-room" data-room="${room.id}">Delete</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;',
      }[char]));
    }

    async function loadAdmin() {
      try {
        const [stats, users, rooms] = await Promise.all([
          request('/api/admin/stats'),
          request('/api/admin/users'),
          request('/api/admin/rooms'),
        ]);
        document.getElementById('locked').classList.add('hidden');
        document.getElementById('admin-content').classList.remove('hidden');
        allUsers = users;
        renderStats(stats);
        renderUsers();
        renderRooms(rooms);
      } catch (err) {
        showLocked(err.message);
      }
    }

    document.getElementById('btn-refresh').addEventListener('click', loadAdmin);
    document.getElementById('user-filter').addEventListener('input', renderUsers);
    document.addEventListener('click', event => {
      const userButton = event.target.closest('[data-action]');
      if (userButton) {
        post(`/api/admin/${userButton.dataset.action}`, { userId: userButton.dataset.user }).catch(err => alert(err.message));
      }
      const roomButton = event.target.closest('[data-room-action]');
      if (roomButton) {
        const action = roomButton.dataset.roomAction;
        const roomId = roomButton.dataset.room;
        if (action === 'rename-room') {
          const name = prompt('New room name', roomButton.dataset.name || '');
          if (name) post('/api/admin/rename-room', { roomId, name }).catch(err => alert(err.message));
          return;
        }
        if (action === 'delete-room' && !confirm('Delete this room?')) return;
        if (action === 'clear-room' && !confirm('Clear all messages in this room?')) return;
        post(`/api/admin/${action}`, { roomId }).catch(err => alert(err.message));
      }
    });

    loadAdmin();
  </script>
</body>
</html>
