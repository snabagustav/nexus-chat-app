<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nexus Admin</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0f1017;color:#eef0f7}button,input{font:inherit}
    .layout{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.side{background:#171923;border-right:1px solid #ffffff12;padding:18px;display:flex;flex-direction:column;gap:14px}.brand{display:flex;align-items:center;gap:10px}.mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#5865f2,#eb459e);display:grid;place-items:center;font-weight:900}.brand h1{font-size:18px;margin:0}.brand small{color:#9aa1b3}.nav button,.back{width:100%;border:0;border-radius:10px;background:transparent;color:#cbd1e1;text-align:left;padding:11px;cursor:pointer}.nav button.active,.nav button:hover,.back:hover{background:#242735;color:white}.back{margin-top:auto;border:1px solid #ffffff12}
    .top{height:66px;background:#12141d;border-bottom:1px solid #ffffff12;display:flex;align-items:center;justify-content:space-between;padding:0 22px}.top h2{margin:0}.content{padding:22px;display:grid;gap:18px}.page{display:none}.page.active{display:grid;gap:18px}.stats{display:grid;grid-template-columns:repeat(6,minmax(100px,1fr));gap:12px}.stat,.card{background:#171923;border:1px solid #ffffff12;border-radius:16px;box-shadow:0 12px 34px #0004}.stat{padding:16px}.stat b{font-size:28px}.stat span{display:block;color:#9aa1b3;font-size:12px;text-transform:uppercase;font-weight:800}.card{overflow:hidden}.head{padding:15px 16px;border-bottom:1px solid #ffffff12;display:flex;justify-content:space-between;gap:10px}.head h3{margin:0}.head input{background:#0f1017;border:1px solid #ffffff1a;color:white;border-radius:9px;padding:9px 11px}
    table{width:100%;border-collapse:collapse}th{text-align:left;color:#8991a6;font-size:11px;text-transform:uppercase;padding:10px 12px;background:#11131c}td{padding:12px;border-top:1px solid #ffffff0d}tr:hover td{background:#ffffff08}.muted{color:#9aa1b3}.badge{border-radius:999px;padding:4px 9px;background:#242735;font-size:12px;font-weight:800}.admin{color:#b9c0ff}.moderator{color:#8df0b5}.warn-b{background:#b7791f33;color:#ffd48a}.bad-b{background:#ed424533;color:#ffb4b4}.actions{display:flex;flex-wrap:wrap;gap:6px}.btn{border:0;border-radius:8px;background:#2b2f3d;color:white;padding:7px 9px;font-weight:800;cursor:pointer}.btn.primary{background:#5865f2}.btn.good{background:#23a559}.btn.warn{background:#b7791f}.btn.bad{background:#ed4245}.toast{position:fixed;right:18px;bottom:18px;background:#171923;border:1px solid #ffffff22;border-radius:12px;padding:12px 15px;opacity:0;transform:translateY(14px);transition:.2s}.toast.show{opacity:1;transform:none}
    @media(max-width:900px){.layout{display:block}.stats{grid-template-columns:repeat(2,1fr)}.content{padding:12px}.table{overflow-x:auto}.actions{min-width:520px}.head{flex-direction:column}}
  </style>
</head>
<body>
  <div class="layout">
    <aside class="side">
      <div class="brand"><div class="mark">N</div><div><h1>Nexus Admin</h1><small>Control center</small></div></div>
      <nav class="nav">
        <button class="active" data-page="dashboard">Dashboard</button>
        <button data-page="users">Users</button>
        <button data-page="rooms">Rooms</button>
      </nav>
      <button class="back" onclick="location.href='/'">Back to app</button>
    </aside>
    <main>
      <header class="top"><h2 id="title">Dashboard</h2><button class="btn primary" onclick="load()">Refresh</button></header>
      <div class="content">
        <section id="dashboard" class="page active"><div id="stats" class="stats"></div></section>
        <section id="users" class="page"><div class="card"><div class="head"><h3>Users</h3><input id="user-q" placeholder="Search users" oninput="renderUsers()"></div><div class="table"><table><thead><tr><th>User</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead><tbody id="users-body"></tbody></table></div></div></section>
        <section id="rooms" class="page"><div class="card"><div class="head"><h3>Rooms</h3><input id="room-q" placeholder="Search rooms" oninput="renderRooms()"></div><div class="table"><table><thead><tr><th>Room</th><th>Type</th><th>Stats</th><th>Actions</th></tr></thead><tbody id="rooms-body"></tbody></table></div></div></section>
      </div>
    </main>
  </div>
  <div id="toast" class="toast"></div>
  <script>
    const headers={Authorization:'Bearer '+localStorage.getItem('nexus_token'),'Content-Type':'application/json'};
    let data={stats:{},users:[],rooms:[]};
    document.querySelectorAll('.nav button').forEach(btn=>btn.onclick=()=>show(btn.dataset.page));
    function show(page){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById(page).classList.add('active');title.textContent=page[0].toUpperCase()+page.slice(1)}
    async function get(path){const r=await fetch(path,{headers});if(!r.ok)throw new Error(await r.text());return r.json()}
    async function act(path,body,msg){const r=await fetch(path,{method:'POST',headers,body:JSON.stringify(body)});note(r.ok?msg:'Failed');if(r.ok)await load()}
    function note(text){toast.textContent=text;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}
    async function load(){try{data.stats=await get('/api/admin/stats');data.users=await get('/api/admin/users');data.rooms=await get('/api/admin/rooms');renderStats();renderUsers();renderRooms()}catch(e){document.body.innerHTML=`<main style="padding:30px"><h1>No admin access</h1><p>Go back, press A, and enter the PIN.</p><button onclick="location.href='/'">Back</button></main>`}}
    function renderStats(){stats.innerHTML=[['Users',data.stats.totalUsers],['Online',data.stats.onlineUsers],['Rooms',data.stats.totalRooms],['Messages',data.stats.totalMessages],['Games',data.stats.games||0],['Muted',data.stats.muted||0]].map(([k,v])=>`<div class="stat"><b>${v||0}</b><span>${k}</span></div>`).join('')}
    function renderUsers(){const q=(document.getElementById('user-q').value||'').toLowerCase();usersBody.innerHTML=data.users.filter(u=>(u.username+' '+(u.email||'')+' '+u.role).toLowerCase().includes(q)).map(u=>`<tr><td><b>${u.username}</b><br><span class="muted">${u.email||'Anonymous'}</span></td><td><span class="badge ${u.role}">${u.role}</span></td><td>${u.muted?'<span class="badge warn-b">muted</span>':''} ${u.banned?'<span class="badge bad-b">banned</span>':''}</td><td><div class="actions"><button class="btn warn" onclick="act('/api/admin/mute',{userId:'${u.id}'},'Muted')">Mute</button><button class="btn" onclick="act('/api/admin/unmute',{userId:'${u.id}'},'Unmuted')">Unmute</button><button class="btn bad" onclick="act('/api/admin/kick',{userId:'${u.id}'},'Kicked')">Kick</button><button class="btn bad" onclick="act('/api/admin/ban',{userId:'${u.id}'},'Banned')">Ban</button><button class="btn" onclick="act('/api/admin/unban',{userId:'${u.id}'},'Unbanned')">Unban</button><button class="btn good" onclick="act('/api/admin/add-mod',{userId:'${u.id}'},'Mod added')">Make mod</button><button class="btn" onclick="act('/api/admin/remove-mod',{userId:'${u.id}'},'Mod removed')">Remove mod</button></div></td></tr>`).join('')}
    function renderRooms(){const q=(document.getElementById('room-q').value||'').toLowerCase();roomsBody.innerHTML=data.rooms.filter(r=>r.name.toLowerCase().includes(q)).map(r=>`<tr><td><b># ${r.name}</b><br><span class="muted">${r.id}</span></td><td>${r.private?'Private':'Public'}</td><td>${r.memberCount} online / ${r.messageCount} messages</td><td><div class="actions"><button class="btn warn" onclick="act('/api/admin/clear-room',{roomId:'${r.id}'},'Cleared')">Clear</button><button class="btn" onclick="renameRoom('${r.id}','${String(r.name).replace(/'/g,"\\'")}')">Rename</button>${r.id==='general'?'':`<button class="btn bad" onclick="act('/api/admin/delete-room',{roomId:'${r.id}'},'Deleted')">Delete</button>`}</div></td></tr>`).join('')}
    function renameRoom(id,name){const next=prompt('New room name',name);if(next)act('/api/admin/rename-room',{roomId:id,name:next},'Renamed')}
    load();
  </script>
</body>
</html>
